name: Decode cover images
on:
  push:
    paths:
      - 'images-src/**'
      - '.github/workflows/decode-images.yml'
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 images
        run: |
          mkdir -p images
          for f in images-src/*.b64; do
            base=$(basename "$f" .b64)
            base64 -d "$f" > "images/$base"
          done
          ls -la images/
      - name: Commit decoded images
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add images/
          git diff --cached --quiet || git commit -m "Decode cover images"
          git push
